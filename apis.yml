name: Human Archive
description: Human Archive is a Stanford- and Berkeley-founded, Y Combinator-funded data lab building
  foundational multimodal datasets for training AI and robotics systems to understand human movement and
  interaction. It collects and labels first-person video, RGB-D, audio, tactile, and motion-capture data
  from a network of 100,000+ contributors and 500+ industry partners, and provides dataset access to
  researchers and enterprise partners through a customer dashboard on request. The company is a B2B data
  infrastructure provider rather than a self-serve platform, and does not publish a public developer API,
  SDKs, or developer documentation at this time.
